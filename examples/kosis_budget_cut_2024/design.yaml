# 2024년 정부 R&D 예산 삭감 — 부처별 집행액. 이 설계서는 게이트가 "비교군 없음"으로 막는 것을 보여 주는 예시다.
name: 2024_RnD_예산삭감_부처별집행
question: "2024년 정부 R&D 예산 삭감(2023 대비 집행 −14%)이 부처별 집행액을 바꿨는가 — 모든 부처가 같은 해에 처치되어 DiD 비교군이 없다"
registered_at: 2026-10-20

data:
  file: panel.csv
  unit: unit
  time: year
  outcome: exec_100m_krw
  outcome_source: "KOSIS DT_127003_002 부처별 국가연구개발사업 집행 추이(억원), kr-sti-data export 2026-10-20"
  log_outcome: true
  cluster: unit

treatment:
  name: "2024년 R&D 예산 삭감"
  timing:
    과학기술정보통신부: 2024
    교육부: 2024
    국가유산청: 2024
    국무조정실: 2024
    국방부: 2024
    국토교통부: 2024
    기상청: 2024
    농림축산식품부: 2024
    농촌진흥청: 2024
    문화체육관광부: 2024
    방위사업청: 2024
    보건복지부: 2024
    산림청: 2024
    산업통상자원부: 2024
    식품의약품안전처: 2024
    원자력안전위원회: 2024
    중소벤처기업부: 2024
    해양수산부: 2024
    환경부: 2024
  always_treated: []
  exclude_units: [개인정보보호위원회, 경찰청, 고용노동부, 공정거래위원회, 관세청, 기획재정부, 법무부, 법제처, 새만금개발청, 소방청, 여성가족부, 외교부, 우주항공청, 인사혁신처, 조달청, 질병관리청, 통일부, 특허청, 해양경찰청, 행정안전부, 행정중심복합도시건설청]   # 2013~2024 전 기간이 없는 부처(2020 이후 통계 진입 등)
  comparison: never_treated
  anticipation: 0

hypotheses:
  - id: H1
    outcome: exec_100m_krw
    direction: negative
    horizon: [0, 0]
    statement: "2024년 집행액(log)이 추세 대비 감소한다"

assumptions:
  parallel_trends:
    pre_periods_min: 3
    note: "비교군이 없으므로 평행추세를 정의할 수 없다"
  sutva:
    spillover_risk: high
    justification: "부처 간 사업 이관·다부처 사업 재분류로 집행액이 부처 사이를 이동한다"
  no_other_policy: "2024년 R&D 예산 기준 변경(약 1.8조원 R&D→非R&D 재분류)이 같은 해에 겹친다"

design:
  method: cs
  min_clusters: 20
  event_window: [-4, 0]
